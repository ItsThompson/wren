name: CI

# Runs after changes land on main and on PRs targeting any branch. The
# lint job runs first and gates the three test jobs; codegen-drift is
# independent. Coverage gates are hard: backend 80%, frontend 70%.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # lint: static checks for the Python workspace + frontend. Gates the test jobs
  # so a broken format/type error fails fast before the (slower) test matrix runs.
  #   backend/mcp/wren-common -> ruff check + ruff format --check + mypy
  #   frontend                -> tsc (typecheck) + oxlint
  # A single `uv sync --all-packages` builds the shared root venv; each step then
  # runs `uv run --no-sync` against it.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync workspace (single root venv, all members)
        run: uv sync --all-packages --frozen

      - name: Backend lint (ruff + mypy)
        working-directory: backend
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy

      - name: MCP lint (ruff + mypy)
        working-directory: mcp
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy

      - name: wren-common lint (ruff + mypy)
        working-directory: shared/wren-common
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck + lint
        working-directory: frontend
        run: |
          npx tsc -b
          npm run lint

  # ---------------------------------------------------------------------------
  # codegen-drift: regenerate the OpenAPI document from the live FastAPI app and
  # the TS client from it, then fail if the committed client is stale.
  # Independent of lint: it guards a frozen contract, not code style.
  # Mirrors `just codegen`.
  # ---------------------------------------------------------------------------
  codegen-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install workspace deps
        run: uv sync --all-packages --frozen

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Regenerate OpenAPI -> TS client
        run: |
          cd backend
          LOG_LEVEL=critical uv run --no-sync python -c "import json; from wren.api.main import app; print(json.dumps(app.openapi(), indent=2))" > ../frontend/openapi.json
          cd ../frontend
          npm run codegen

      - name: Fail on stale committed client or operation registry
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts frontend/src/api/operationRegistry.generated.ts

  # ---------------------------------------------------------------------------
  # mcp-codegen-drift: regenerate the internal app's OpenAPI and the MCP Group-A
  # schema module from it, then fail if the committed artifact or generated module
  # is stale. The MCP analog of codegen-drift, for the internal surface the MCP
  # tools consume. Inlines the `just codegen-mcp` pipeline (the runner has uv, not
  # just), mirroring how codegen-drift inlines `just codegen`. The generator
  # (datamodel-code-generator) is an MCP dev dependency, so `uv sync --all-packages`
  # provides it; the MCP image never runs this and only copies the committed file.
  # ---------------------------------------------------------------------------
  mcp-codegen-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace deps
        run: uv sync --all-packages --frozen

      - name: Regenerate the internal OpenAPI + MCP Group-A schema module
        run: |
          LOG_LEVEL=critical uv run --no-sync --package wren python -c "import json; from wren.api_internal.main import app; print(json.dumps(app.openapi(), indent=2))" > mcp/internal-openapi.json
          genin="$(mktemp)"
          uv run --no-sync --package wren-mcp python mcp/scripts/build_generation_input.py mcp/internal-openapi.json > "$genin"
          uv run --no-sync --package wren-mcp datamodel-codegen \
            --input "$genin" --input-file-type openapi \
            --output-model-type pydantic_v2.BaseModel --target-python-version 3.12 \
            --use-standard-collections --use-union-operator --use-annotated --field-constraints \
            --capitalise-enum-members --set-default-enum-member \
            --strict-nullable --disable-timestamp \
            --custom-file-header "$(cat mcp/scripts/generated_module_header.txt)" \
            --formatters black --formatters isort \
            --output mcp/src/wren_mcp/_schemas_generated.py
          cd mcp
          uv run --no-sync ruff format src/wren_mcp/_schemas_generated.py
          uv run --no-sync ruff check --fix src/wren_mcp/_schemas_generated.py

      - name: Fail on stale committed artifact or generated module
        run: git diff --exit-code -- mcp/internal-openapi.json mcp/src/wren_mcp/_schemas_generated.py

  # ---------------------------------------------------------------------------
  # contract-drift: run the dev/test-only `contract/` uv project, the only
  # interpreter where `wren.*` and `wren_mcp.*` import together (it editable
  # path-installs both packages; neither deployable depends on the other). It
  # guards the cross-package frozen contract: the internal-
  # boundary header constants (X-User-ID, X-Internal-Api-Token) plus the
  # X-Request-ID correlation header, the OAuth scope set (PRM vs AS metadata),
  # and the backend<->MCP schema mirror (Group A
  # shapes asserted field-equal, the lean write results asserted a fields-subset).
  # An independent failure signal, gated by lint like the test jobs; not folded
  # into the isolated-venv test-backend steps. Mirrors codegen-drift's frozen-
  # contract-guard shape.
  # ---------------------------------------------------------------------------
  contract-drift:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Contract drift (cross-package header + scope constants + schema mirror)
        working-directory: contract
        run: |
          uv sync --all-packages --frozen
          uv run --no-sync pytest

  # ---------------------------------------------------------------------------
  # test-scripts: pure-bash test harnesses for scripts/tests/*.sh (deploy,
  # user-ops, and any future harness). Auto-discovers *_test.sh via
  # scripts/tests/run_all.sh, so adding a harness never requires a ci.yml edit.
  # The topology harness also validates the TypeScript runtime configuration.
  # Gated by lint.
  # ---------------------------------------------------------------------------
  test-scripts:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install script-test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y just
          uv sync --all-packages --frozen

      - name: Script test harnesses (scripts/tests/*_test.sh)
        run: bash scripts/tests/run_all.sh

  # ---------------------------------------------------------------------------
  # test-backend: pytest with the hard 80% coverage gate over the backend, plus
  # the MCP suite (tool-schema snapshot + tool contract tests). Real Postgres is
  # started per-test by testcontainers-python (Docker is present on the runner),
  # covering the DB integration, OAuth/Authlib flow, and MCP layers. Gated by
  # lint.
  # ---------------------------------------------------------------------------
  test-backend:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace (single root venv, all members)
        run: uv sync --all-packages --frozen

      - name: Backend tests (pytest + 80% coverage gate, Postgres via testcontainers)
        working-directory: backend
        run: uv run --no-sync pytest

      - name: MCP tests (tool-schema snapshot + tool contract, 80% coverage gate)
        working-directory: mcp
        run: uv run --no-sync pytest

      - name: wren-common tests (metrics + health seam tests)
        working-directory: shared/wren-common
        run: uv run --no-sync pytest

  # ---------------------------------------------------------------------------
  # test-frontend: vitest with the hard 70% coverage gate (the thresholds in
  # vite.config.ts fail the run below the floor). Gated by lint.
  # ---------------------------------------------------------------------------
  test-frontend:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Vitest + 70% coverage gate
        working-directory: frontend
        run: npm run test:coverage

  # ---------------------------------------------------------------------------
  # e2e: run the canonical production-mode HTTPS lifecycle through the same
  # repository commands used locally. Gated by lint. This remains one job and
  # one stable check: sharding is reviewed only after the measured thresholds.
  # ---------------------------------------------------------------------------
  e2e:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WREN_E2E_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Start E2E timing
        run: |
          mkdir -p /tmp/wren-e2e-timing
          date +%s%3N > /tmp/wren-e2e-timing/job-start-ms

      - name: Install E2E system dependencies
        run: sudo apt-get update && sudo apt-get install -y just mkcert libnss3-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace for ingress generation
        run: uv sync --all-packages --frozen

      - name: Prepare trusted E2E environment
        run: just setup-e2e

      - name: Run E2E package quality gates
        run: |
          just e2e-typecheck
          just e2e-lint
          just test-e2e-unit

      - name: Start production HTTPS E2E topology
        run: just e2e-up

      - name: Run Playwright system tests
        id: playwright
        run: |
          date +%s%3N > /tmp/wren-e2e-timing/playwright-start-ms
          set +e
          just test-e2e-system
          status=$?
          set -e
          date +%s%3N > /tmp/wren-e2e-timing/playwright-end-ms
          exit "$status"
        env:
          CI: true
          E2E_WORKERS: 2
          E2E_RETRIES: 1
          E2E_SENSITIVE_VALUES_DIR: /tmp/wren-e2e-sensitive

      - name: Capture and sanitize diagnostics on failure
        id: capture
        if: failure()
        run: just e2e-capture-artifacts

      - uses: actions/upload-artifact@v4
        if: failure() && steps.capture.outcome == 'success'
        with:
          name: e2e-safe-diagnostics
          path: /tmp/wren-safe-artifacts/
          retention-days: 7

      - name: Stop the stack and remove generated material
        if: always()
        run: just e2e-down

      - name: Reset E2E trust
        if: always()
        run: just reset-e2e-trust

      - name: Report E2E runtime evidence
        if: always()
        run: |
          end_ms="$(date +%s%3N)"
          start_ms="$(cat /tmp/wren-e2e-timing/job-start-ms 2>/dev/null || true)"
          playwright_start_ms="$(cat /tmp/wren-e2e-timing/playwright-start-ms 2>/dev/null || true)"
          playwright_end_ms="$(cat /tmp/wren-e2e-timing/playwright-end-ms 2>/dev/null || true)"
          if [[ "$start_ms" =~ ^[0-9]+$ ]]; then
            complete_job_duration_ms=$((end_ms - start_ms))
          else
            complete_job_duration_ms=null
          fi
          if [[ "$playwright_start_ms" =~ ^[0-9]+$ && "$playwright_end_ms" =~ ^[0-9]+$ ]]; then
            playwright_step_duration_ms=$((playwright_end_ms - playwright_start_ms))
          else
            playwright_step_duration_ms=null
          fi
          {
            echo '## E2E runtime evidence'
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "- Complete-job duration (ms): ${complete_job_duration_ms}"
            echo "- Playwright-step duration (ms): ${playwright_step_duration_ms}"
            echo '- Worker count: `2`'
            echo '- Retry count: `1`'
            echo '- Browser: `chromium`'
            echo '- Shards: `none`'
            echo '- Normal complete-job target: under 300s, excluding runner queue time.'
            echo '- Sharding review thresholds: complete-job p95 > 240s, Playwright p95 > 180s, worker speedup < 1.3x, repeatable shared-stack contention, or an incompatible environment.'
            echo '- Collect three to five completed-run summaries before assessing p95 or changing the one-job policy.'
          } >> "$GITHUB_STEP_SUMMARY"
